<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">

<!-- FIX PENTING: RESPONSIVE VIEWPORT -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kodam Siswa XA</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: radial-gradient(circle, #1a1a2e, #0f3460);
  color: white;
  text-align: center;
  min-height: 100vh;
}

/* HEADER */
h1 {
  margin-top: 40px;
  font-size: 38px;
  text-shadow: 0 0 10px #00f2fe;
}

/* INPUT (RESPONSIVE FIX) */
input {
  padding: 12px;
  border-radius: 12px;
  border: none;
  width: 80%;
  max-width: 300px;
  font-size: 16px;
  margin-top: 20px;
}

/* BUTTON */
button {
  padding: 12px 25px;
  margin-top: 15px;
  border: none;
  border-radius: 12px;
  background: linear-gradient(45deg, #00f2fe, #4facfe);
  color: white;
  font-size: 16px;
  cursor: pointer;
  transition: 0.3s;
}
button:hover {
  transform: scale(1.1);
}

/* LOADING */
.loading {
  margin-top: 20px;
  display: none;
}

/* CARD STYLE (RESPONSIVE FIX) */
.card {
  margin-top: 25px;
  padding: 20px;
  width: 90%;
  max-width: 300px;
  margin-left: auto;
  margin-right: auto;
  border-radius: 20px;
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(10px);
  border: 2px solid rgba(0,242,254,0.5);
  box-shadow: 0 0 25px rgba(0,242,254,0.4);
  animation: pop 0.6s ease-in-out;
}

@keyframes pop {
  from {transform: scale(0.5); opacity: 0;}
  to {transform: scale(1); opacity: 1;}
}

.card img {
  width: 150px;
  height: 150px;
  object-fit: cover;
  border-radius: 15px;
  border: 2px solid white;
  margin-top: 10px;
}

.card h2 {
  color: #00f2fe;
  margin: 10px 0;
}

.card p {
  font-size: 14px;
  opacity: 0.9;
}

/* FOOTER */
.footer {
  position: fixed;
  bottom: 10px;
  width: 100%;
  font-size: 12px;
  opacity: 0.6;
}
</style>
</head>

<body>

<h1>🔮 Kodam Siswa XA 🔮</h1>
<p>Masukkan nama untuk memanggil kodam</p>

<input type="text" id="nama" placeholder="Masukkan nama...">
<br>

<button onclick="mulai()">🔍 Cek Kodam</button>

<div class="loading" id="loading">⏳ Membaca aura...</div>

<div id="hasil"></div>

<div class="footer">Hanya hiburan 😂</div>

<!-- MUSIK -->
<audio id="bgm" loop>
  <source src="https://www.soundjay.com/free-music/midnight-ride-01a.mp3" type="audio/mpeg">
</audio>

<audio id="sound" src="https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3"></audio>

<script>
const dataKodam = [
  {nama: "Macan Putih", img: "https://i.imgur.com/4AiXzf8.jpeg"},
  {nama: "hellokity blonde", img: "IMG_20260421_120733.jpg"},
  {nama: "kai jeus", img: "IMG_20260421_120756.jpg"},
  {nama: "Papuyu bagincu", img: "IMG_20260421_120646.jpg"},
  {nama: "Serigala ", img: "IMG_20260421_120704.jpg"},
  {nama: "Ayam starboy", img: "IMG_20260421_120837.jpg"}
];

function playMusic() {
  const bgm = document.getElementById("bgm");
  bgm.volume = 0.3;
  bgm.play();
}

function mulai() {
  const nama = document.getElementById("nama").value;
  const loading = document.getElementById("loading");
  const hasil = document.getElementById("hasil");

  if (nama === "") {
    alert("Isi nama dulu!");
    return;
  }

  playMusic();

  hasil.innerHTML = "";
  loading.style.display = "block";

  setTimeout(() => {

    let total = 0;
    for (let i = 0; i < nama.length; i++) {
      total += nama.charCodeAt(i);
    }

    const index = total % dataKodam.length;
    const kodam = dataKodam[index];

    loading.style.display = "none";

    document.getElementById("sound").play();

    hasil.innerHTML = `
      <div class="card">
        <h2>✨ ${nama.toUpperCase()}</h2>
        <p>🔥 KODAM TERPILIH</p>
        <img src="${kodam.img}">
        <h3>${kodam.nama}</h3>
        <p>Level: S-Class Spirit</p>
      </div>
    `;

  }, 2000);
}
</script>

</body>
</html>
